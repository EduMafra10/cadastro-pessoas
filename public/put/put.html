<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Editar Pessoa</title>

  <link rel="stylesheet" href="/css/style.css">
  <script src="/put/put.js" defer></script>
</head>
<body>
  <div class="container">
    <header class="cabecalho">
      <a class="voltar" href="/">Voltar ao início</a>
      <h1>Editar Pessoa</h1>
      <p>Busque pelo CPF para alterar os dados do cadastro.</p>
    </header>

    <main>
      <form id="formulario-busca" class="formulario">
        <div class="campo">
          <label for="cpf-busca">CPF — somente números</label>
          <input
            type="text"
            id="cpf-busca"
            name="cpf-busca"
            inputmode="numeric"
            maxlength="11"
            pattern="[0-9]{11}"
            title="Digite os 11 números do CPF, sem pontos ou traço."
            required
          >
        </div>

        <div class="acoes">
          <button type="submit" id="botao-buscar" class="botao">
            Buscar pessoa
          </button>
        </div>
      </form>

      <p id="mensagem" class="mensagem" role="status"></p>

      <form
        id="formulario-edicao"
        class="formulario formulario-edicao"
        hidden
      >
        <div class="grade-campos">
          <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" required>
          </div>

          <div class="campo">
            <label for="sobrenome">Sobrenome</label>
            <input type="text" id="sobrenome" name="sobrenome" required>
          </div>

          <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required>
          </div>

          <div class="campo">
            <label for="idade">Idade</label>
            <input
              type="number"
              id="idade"
              name="idade"
              min="0"
              max="130"
              step="1"
              required
            >
          </div>

          <div class="campo">
            <label for="cpf">CPF — somente números</label>
            <input
              type="text"
              id="cpf"
              name="cpf"
              inputmode="numeric"
              maxlength="11"
              pattern="[0-9]{11}"
              title="Digite os 11 números do CPF, sem pontos ou traço."
              required
            >
          </div>

          <div class="campo">
            <label for="rg">RG</label>
            <input type="text" id="rg" name="rg" required>
          </div>

          <div class="campo">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone" required>
          </div>

          <div class="campo">
            <label for="rua">Rua</label>
            <input type="text" id="rua" name="rua" required>
          </div>

          <div class="campo">
            <label for="bairro">Bairro</label>
            <input type="text" id="bairro" name="bairro" required>
          </div>

          <div class="campo">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" name="cidade" required>
          </div>

          <div class="campo">
            <label for="estado">Estado</label>
            <select id="estado" name="estado" required>
              <option value="">Selecione</option>
              <option value="AC">Acre</option>
              <option value="AL">Alagoas</option>
              <option value="AP">Amapá</option>
              <option value="AM">Amazonas</option>
              <option value="BA">Bahia</option>
              <option value="CE">Ceará</option>
              <option value="DF">Distrito Federal</option>
              <option value="ES">Espírito Santo</option>
              <option value="GO">Goiás</option>
              <option value="MA">Maranhão</option>
              <option value="MT">Mato Grosso</option>
              <option value="MS">Mato Grosso do Sul</option>
              <option value="MG">Minas Gerais</option>
              <option value="PA">Pará</option>
              <option value="PB">Paraíba</option>
              <option value="PR">Paraná</option>
              <option value="PE">Pernambuco</option>
              <option value="PI">Piauí</option>
              <option value="RJ">Rio de Janeiro</option>
              <option value="RN">Rio Grande do Norte</option>
              <option value="RS">Rio Grande do Sul</option>
              <option value="RO">Rondônia</option>
              <option value="RR">Roraima</option>
              <option value="SC">Santa Catarina</option>
              <option value="SP">São Paulo</option>
              <option value="SE">Sergipe</option>
              <option value="TO">Tocantins</option>
            </select>
          </div>
        </div>

        <div class="acoes">
          <button type="submit" id="botao-salvar" class="botao">
            Salvar alterações
          </button>
        </div>
      </form>
    </main>
  </div>
</body>
</html>
